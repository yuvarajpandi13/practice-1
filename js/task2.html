<body>
        <input type="text" id="valueinput">
<button onclick="countc()">Count</button>

<p id="upper"></p>
<p id="lower"></p>
<p id="number"></p>
<p id="special"></p>

    <script>

    
function countc() {

    let str = document.getElementById("valueinput").value;

    let up = 0;
    let lo = 0;
    let nu = 0;
    let sp = 0;
    let i;

    for (i = 0;i<str.length;i++) {

        if(str[i]>="A"&&str[i]<="Z")
            up++;
        else if(str[i]>="a" && str[i]<="z")
            lo++;
        else if(str[i]>="0" && str[i]<="9")
            nu++;
        else
            sp++;
    }
    // console.log("upper",up)
    // console.log("lower",lo)
    // console.log("number",nu)
    // console.log("Special",sp)

    document.getElementById("upper").innerText= "Upper: "+up;
    document.getElementById("lower").innerText = "Lower: " +lo;
    document.getElementById("number").innerText = "Numbers: " +nu;
    document.getElementById("special").innerText = "Special: " +sp;
}
