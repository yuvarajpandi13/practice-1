<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<pre>")
            let i,j,r
            for(i=1;i<=6;i++){
                r=""
                for(j=1;j<=5;j++){
                    if ((j==1 && i<= 5)||(j==5 && i<=5)||(i==6 && j>=1 && j<=5)){
                        r+="*"
                    }
                else{
                        r+=" "
                }
                r+="  "
                }
                
                document.writeln(r + "<br>")
                
            }
    </script>
    
</body>
</html>
