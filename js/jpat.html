<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<pre>");
        let i,j,r
        for(i=1;i<=5;i++){
            r=""
            for(j=1;j<=5;j++){
                if((i<=5&&j==4)||(i>=4&&j==2)||(i==6&&j>1&&j<=4)){
                    r+="*"
                }
            else{
                    r+=" "
            }
            r+="  "
            }
                
            document.writeln(r + "<br>")
        }
    </script>
</body>
</html>
