<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        document.write("<pre>");
        let i,j,r
        for(i=1;i<=5;i++){
            r=""
            for(j=1;j<=5;j++){
                if ((i==1 &&(j==1 || j==5)) || (i==2 && (j==2 || j==4))||(i >= 3 && j == 3)){
                    r+="*"
                }
            else{
                    r+=" "
            }
            r+="  "
            }
                
            document.writeln(r + "<br>")
        }
    </script>
</body>
</html>
