<!DOCTYPE html>
<html>
<head>
    <title>Will You Be My Valentine? ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .buttons {
            position: relative;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        .yes {
            background-color: #ff4d6d;
            color: white;
        }

        .yes:hover {
            background-color: #e63950;
            transform: scale(1.1);
        }

        .no {
            background-color: #ccc;
            color: black;
            position: absolute;
        }

        .message {
            margin-top: 20px;
            font-size: 20px;
            color: #ff4d6d;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Will You Be My Valentine? ❤️</h1>
    <div class="buttons">
        <button class="yes" onclick="showLove()">Yes 💖</button>
        <button class="no" onmouseover="moveButton()">No 😢</button>
    </div>
    <div class="message" id="loveMessage">
        Yayyyy!! You just made my day! 💕🥰
    </div>
</div>

<script>
    function showLove() {
        document.getElementById("loveMessage").style.display = "block";
    }

    function moveButton() {
        const noBtn = document.querySelector(".no");
        noBtn.style.top = Math.random() * 200 + "px";
        noBtn.style.left = Math.random() * 200 + "px";
    }
</script>

</body>
</html>
